name: Quick Install

# Installs the way a new machine would. It runs daily to catch breakage from
# outside this repo, like a new chezmoi release or runner image.

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/one_line_install.yml
  workflow_dispatch:
  schedule:
    # 12:30 UTC daily
    - cron: "30 12 * * *"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      # bash, so the step runs with pipefail and fails when the download does
      - shell: bash
        run: curl -fsSL "https://get.chezmoi.io" | sh -s -- -b ~/.local/bin init -a georgewitteman

  codespaces:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/universal:linux
      env:
        CODESPACES: true
    steps:
      # The container starts as root, but codespaces clone the dotfiles and
      # run install.sh as the image's regular user (uid 1000), so do the same
      # here.
      - run: |
          user="$(awk -F: '$3 == 1000 { print $1 }' /etc/passwd)"
          su "$user" -c 'git clone --quiet --depth 1 https://github.com/georgewitteman/dotfiles ~/dotfiles && ~/dotfiles/install.sh'
