name: Quick Install

# Runs the one-line install from the README, the way a new machine would. It
# runs daily too, to catch breakage from outside this repo (a new chezmoi
# release, new runner images, ...).

"on":
  push:
    branches:
      - main
  schedule:
    # 5am PT daily
    - cron: "30 12 * * *"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - run: curl -fsSL "https://get.chezmoi.io" | sh -s -- -b ~/.local/bin -d init -a georgewitteman

  codespaces:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/universal:linux
      env:
        CODESPACES: true
    steps:
      - run: curl -fsSL "https://get.chezmoi.io" | sh -s -- -b ~/.local/bin -d init -a georgewitteman
