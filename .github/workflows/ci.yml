name: CI

# Quoted, since YAML 1.1 reads a bare on as true.
"on":
  push:

jobs:
  runners:
    strategy:
      # Keep running the other jobs when one fails.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        chezmoi: [oldest, latest]
        # macOS only runs the latest chezmoi, since its runners are often in
        # short supply. Linux covers the oldest.
        exclude:
          - os: macos-latest
            chezmoi: oldest
    runs-on: ${{ matrix.os }}
    env:
      CHEZMOI: ${{ matrix.chezmoi }}
    steps:
      # Check out with plain git instead of a third-party action, so nothing
      # here needs updating. --depth 1 fetches only this commit, and git fetch
      # saves what it fetched as FETCH_HEAD.
      - name: Check out
        run: |
          git init --quiet .
          git fetch --quiet --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$GITHUB_SHA"
          git checkout --quiet FETCH_HEAD
      - name: Install dotfiles
        run: |
          if [ "$CHEZMOI" = oldest ]; then
            ./install.sh -t "v$(cat .chezmoiversion)"
          else
            ./install.sh
          fi
      - name: Run tests
        run: ./check

  codespaces:
    strategy:
      # Keep running the other jobs when one fails.
      fail-fast: false
      matrix:
        image:
          - mcr.microsoft.com/devcontainers/base:alpine
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/universal:linux
        chezmoi: [oldest, latest]
    runs-on: ubuntu-latest
    env:
      CHEZMOI: ${{ matrix.chezmoi }}
    container:
      image: ${{ matrix.image }}
      env:
        CODESPACES: true
    steps:
      # The container starts as root, but codespaces clone and apply dotfiles as
      # the image's regular user (uid 1000), so do the same here. awk -F:
      # splits /etc/passwd at each :, and prints the name (field 1) of the user
      # whose uid (field 3) is 1000. The fetch is the same as in the job above.
      - name: Install dotfiles and run tests
        run: |
          user="$(awk -F: '$3 == 1000 { print $1 }' /etc/passwd)"
          su "$user" -c '
            set -e
            git init --quiet ~/dotfiles
            cd ~/dotfiles
            git fetch --quiet --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$GITHUB_SHA"
            git checkout --quiet FETCH_HEAD
            if [ "$CHEZMOI" = oldest ]; then
              ./install.sh -t "v$(cat .chezmoiversion)"
            else
              ./install.sh
            fi
            ./check
          '
