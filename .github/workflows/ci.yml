name: CI

"on":
  push:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  runners:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: ./install.sh -t "v$(cat .chezmoiversion)"
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: extractions/setup-just@v4
      - name: "Run sanity checks"
        run: just verbose=true check

  codespaces:
    strategy:
      fail-fast: false
      matrix:
        image:
          - mcr.microsoft.com/devcontainers/base:alpine
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/universal:linux
    runs-on: ubuntu-26.04
    container:
      image: ${{ matrix.image }}
      env:
        CODESPACES: true
      options: "--user root"
    steps:
      - uses: actions/checkout@v7
      - run: ./install.sh -t "v$(cat .chezmoiversion)"
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: extractions/setup-just@v4
      - run: just verbose=true check
        # Don't run the checker for the universal container. It has nvs
        # installed which runs `[ -n "${BASH_SOURCE}" ]` which fails when the
        # `nounset` option is on.
        if: ${{ ! contains(matrix.image, 'universal') }}

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: 'curl -sS https://webinstall.dev/shfmt | bash'
      - run: 'curl -sS https://webinstall.dev/shellcheck | bash'
      - run: rm -rf ~/.nvm
      - run: ./install.sh
      - run: just verbose=true lint

  misspell:
    name: misspell
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-misspell@v1.31.0
        with:
          locale: US
          filter_mode: nofilter
          # Vendored vim plugins are copied as-is from upstream
          exclude: ./home/exact_dot_vim/exact_pack/*
          fail_level: error
