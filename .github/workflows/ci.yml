name: CI

"on":
  push:

# Plain shell commands only (no third-party actions), so there's nothing here
# that needs updating.

jobs:
  runners:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        run: |
          git init --quiet .
          git fetch --quiet --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$GITHUB_SHA"
          git checkout --quiet FETCH_HEAD
      - name: Install dotfiles
        run: ./install.sh -t "v$(cat .chezmoiversion)"
      - name: Run tests
        run: |
          for test_file in tests/test_*; do
            echo "RUNNING: ${test_file}"
            sh -eux "$test_file"
          done
      # shellcheck comes preinstalled on the Ubuntu runner
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          cd "$HOME"
          "${HOME}/.scripts/get-files-to-lint" | sed "s#${HOME}/##" | xargs shellcheck

  codespaces:
    strategy:
      fail-fast: false
      matrix:
        image:
          - mcr.microsoft.com/devcontainers/base:alpine
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/universal:linux
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      env:
        CODESPACES: true
      options: "--user root"
    steps:
      - name: Check out
        run: |
          git init --quiet .
          git fetch --quiet --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$GITHUB_SHA"
          git checkout --quiet FETCH_HEAD
      - name: Install dotfiles
        run: ./install.sh -t "v$(cat .chezmoiversion)"
      # Skipped for the universal image: it has nvs installed, which runs
      # `[ -n "${BASH_SOURCE}" ]` and fails when the `nounset` option is on.
      - name: Run tests
        if: ${{ ! contains(matrix.image, 'universal') }}
        run: |
          for test_file in tests/test_*; do
            echo "RUNNING: ${test_file}"
            sh -eux "$test_file"
          done
