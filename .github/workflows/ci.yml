name: CI

"on":
  push:

# Plain shell commands only (no third-party actions), so there's nothing here
# that needs updating.

jobs:
  runners:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        run: |
          git init --quiet .
          git fetch --quiet --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$GITHUB_SHA"
          git checkout --quiet FETCH_HEAD
      - name: Install dotfiles
        run: ./install.sh
      - name: Run tests
        run: |
          for test_file in tests/test_*; do
            echo "RUNNING: ${test_file}"
            sh -eux "$test_file"
          done
      # shellcheck comes preinstalled on the Ubuntu runner
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          cd "$HOME"
          "${HOME}/.scripts/get-files-to-lint" | sed "s#${HOME}/##" | xargs shellcheck

  codespaces:
    strategy:
      fail-fast: false
      matrix:
        image:
          - mcr.microsoft.com/devcontainers/base:alpine
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/universal:linux
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      env:
        CODESPACES: true
    steps:
      # The container starts as root, but codespaces clone and apply dotfiles as
      # the image's regular user (uid 1000), so do the same here.
      - name: Install dotfiles and run tests
        run: |
          user="$(awk -F: '$3 == 1000 { print $1 }' /etc/passwd)"
          su "$user" -c '
            set -e
            git init --quiet ~/dotfiles
            cd ~/dotfiles
            git fetch --quiet --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$GITHUB_SHA"
            git checkout --quiet FETCH_HEAD
            ./install.sh
            for test_file in tests/test_*; do
              echo "RUNNING: ${test_file}"
              sh -eux "$test_file"
            done
          '
